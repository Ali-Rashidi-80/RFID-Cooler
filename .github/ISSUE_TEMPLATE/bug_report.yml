name: Bug report
description: Report incorrect behavior, safety issue, or regression
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Safety:** Do not post mains wiring photos with live conductors exposed.
        For security issues see [SECURITY.md](../SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Offline (RFID only)
        - Online (WSS)
        - SoftAP / LAN HTTP
        - Other channel (BLE / SMS / RF433 / wall)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Firmware snapshot (commit or date)
      placeholder: e.g. abc1234 or 2026-08-31

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Flash ...
        2. Tap card ...
        3. Observe ...

  - type: textarea
    id: logs
    attributes:
      label: Serial log (redact tokens)
      render: shell
